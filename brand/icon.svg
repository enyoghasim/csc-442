      <stop offset="0" stop-color="#fafbfd" />
      <stop offset="0.16" stop-color="#e7ebf1" />
      <stop offset="0.36" stop-color="#a9b3c2" />
      <stop offset="0.6" stop-color="#5b6675" />
      <stop offset="0.82" stop-color="#20242e" />
      <stop offset="1" stop-color="#08090c" />
