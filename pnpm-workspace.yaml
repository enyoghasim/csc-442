packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Pure install-time analytics ping, no functional purpose (unlike the three below, which need
  # their build step to actually work) — left disabled.
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '*'
  - '@expo/cli@57.0.15'
  - '@expo/config-plugins@57.0.8'
  - '@expo/prebuild-config@57.0.12'
  - '@expo/router-server@57.0.6'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-constants@57.0.11
  - expo-file-system@57.0.3
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-server@57.0.3
  - expo@57.0.13
  - '@expo/ui@57.0.11'
  - expo-linking@57.0.6
  - expo-router@57.0.13
  - expo-updates@57.0.15
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - expo-router@57.0.14
